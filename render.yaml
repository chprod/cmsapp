databases:
  - name: cmsapp-studio-db
    plan: free
    databaseName: studio
    user: studio

services:
  - type: web
    name: cmsapp-studio
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build:contract && npm run build -w @chedraui-xp/studio
    startCommand: npm run start -w @chedraui-xp/studio
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: cmsapp-studio-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SEED_ON_BOOT
        value: "true"
      - key: RESOLVER_WEBHOOK_URL
        sync: false
      - key: RESOLVER_WEBHOOK_SECRET
        sync: false
